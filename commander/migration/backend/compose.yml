name: north55-commander-integration
x-environment: &environment
  ENV_FILE: /dev/null
  ENVIRONMENT: test
  PYTHONPATH: /app
  PYTHONDONTWRITEBYTECODE: '1'
  DATABASE_URL: postgresql+asyncpg://commander_test:commander_test@db:5432/commander_test
  DATABASE_SYNC_URL: postgresql+psycopg://commander_test:commander_test@db:5432/commander_test
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  ENABLE_METRICS: 'false'
  ENABLE_RATE_LIMIT: 'false'
  ADMIN_LOGIN: admin
  ADMIN_PASSWORD: commander-integration-only
  ADMIN_EMAIL: admin@example.test
  JWT_SECRET_KEY: commander-isolated-test-access-key
  JWT_REFRESH_SECRET_KEY: commander-isolated-test-refresh-key
  SPEECH_DATA_DIR: /tmp/speech
  MEDIA_UPLOAD_DIR: /tmp/media
  FEEDBACK_UPLOAD_DIR: /tmp/feedback
  OPENAI_API_KEY: ''
  RUN_LIVE_AI: '0'
  AWS_EC2_METADATA_DISABLED: 'true'
x-backend: &backend
  image: ${COMMANDER_BACKEND_TEST_IMAGE:-firefly-backend-tests:latest}
  working_dir: /app
  environment: *environment
  volumes:
    - ../../../firefly-backend/app:/app/app:ro
    - ../../../firefly-backend/alembic:/app/alembic:ro
    - ../../../firefly-backend/alembic.ini:/app/alembic.ini:ro
    - ../../../firefly-backend/tests:/app/tests:ro
    - ./seed.py:/smoke/seed.py:ro
services:
  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: commander_test
      POSTGRES_PASSWORD: commander_test
      POSTGRES_DB: commander_test
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U commander_test -d commander_test]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks: [default, browser]
    ports: ['127.0.0.1:8898:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/api/health/ready]
      interval: 2s
      timeout: 5s
      retries: 30
networks:
  default:
    internal: true
    ipam:
      config: [{subnet: "10.253.80.0/28"}]
  browser:
    ipam:
      config: [{subnet: "10.253.81.0/28"}]
