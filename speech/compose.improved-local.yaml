name: north55-improved-local
services:
  transcribe:
    image: north55-speech-gpu:0.1.0
    entrypoint: [python, -m, north55_speech.local_transcription]
    network_mode: none
    environment:
      PYTHONPATH: /code/src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CUDA_VISIBLE_DEVICES: '0'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    volumes:
      - ./src:/code/src:ro
      - ./reports/improvement-v1/recipe:/recipe:ro
      - ./data/local-audio:/input:ro
      - ./reports/local-transcriptions:/output
      - audio:/audio:ro
      - models:/models:ro
volumes:
  audio:
    external: true
    name: north55-speech_audio_data
  models:
    external: true
    name: north55-speech_model_cache
