name: north55-annotation-expanded-v13
services:
  prepare:
    image: north55-speech-train:publisher-v2
    network_mode: none
    entrypoint: [python, -u, -m, scripts.expand_annotation_queue_v13]
    working_dir: /code
    environment:
      PYTHONPATH: /code/src:/code
    volumes:
      - .:/workspace:ro
      - ./src:/code/src:ro
      - ./scripts:/code/scripts:ro
      - ./data/curated/annotation-expanded-v13:/packet
      - audio:/audio
  drafts:
    image: north55-speech-train:publisher-v2
    network_mode: none
    entrypoint: [python, -u, -m, scripts.generate_annotation_drafts]
    command: [--packet, /packet, --split, dev, --allow-control-drafts]
    working_dir: /code
    environment:
      PYTHONPATH: /code/src:/code
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CUDA_VISIBLE_DEVICES: '0'
      LD_LIBRARY_PATH: /opt/venv/lib/python3.11/site-packages/nvidia/cublas/lib:/opt/venv/lib/python3.11/site-packages/nvidia/cudnn/lib
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    volumes:
      - ./src:/code/src:ro
      - ./scripts:/code/scripts:ro
      - ./data/curated/annotation-expanded-v13:/packet
      - audio:/audio:ro
      - models:/models:ro
  review:
    image: north55-annotation-tools:0.1.0
    init: true
    command: [uvicorn, scripts.review_dataset:factory, --factory, --host, '0.0.0.0', --port, '8010', --workers, '1', --no-access-log]
    environment:
      NORTH55_API_KEY: ${NORTH55_API_KEY:?Run bootstrap}
      NORTH55_SESSION_SECRET: ${NORTH55_SESSION_SECRET:?Run bootstrap}
      NORTH55_ANNOTATION_ROOT: /packet
      NORTH55_PREFER_ENGLISH_DRAFTS: '1'
    ports: ['127.0.0.1:8012:8010']
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/curated/annotation-expanded-v13:/packet
      - audio:/audio:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  audio:
    external: true
    name: north55-speech_audio_data
  models:
    external: true
    name: north55-speech_model_cache
