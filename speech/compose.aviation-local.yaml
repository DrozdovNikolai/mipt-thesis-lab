name: north55-aviation-local
services:
  transcribe:
    image: north55-speech-gpu:0.1.0
    network_mode: none
    entrypoint: [python, -m, north55_speech.local_transcription, --language, en]
    environment:
      PYTHONPATH: /code/src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CUDA_VISIBLE_DEVICES: '0'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    volumes:
      - ./src:/code/src:ro
      - ./reports/aviation-v1/recipe:/recipe:ro
      - ./data/local-audio:/input:ro
      - ./reports/local-transcriptions/aviation:/output
      - models:/models:ro
volumes:
  models:
    external: true
    name: north55-speech_model_cache
