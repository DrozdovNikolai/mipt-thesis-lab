[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "north55-speech"
version = "0.1.0"
description = "Local cockpit and simulator speech review and reproducible evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.5",
  "pydantic-settings==2.15.0", "python-multipart==0.0.20",
  "jinja2==3.1.6", "itsdangerous==2.2.0", "celery==5.6.3",
  "sqlalchemy==2.0.52", "alembic==1.20.0", "psycopg[binary]==3.3.5",
  "faster-whisper==1.2.1", "ctranslate2==4.8.2",
  "numpy==2.2.6", "scipy==1.15.3", "soundfile==0.13.1",
  "scikit-learn==1.7.2", "jiwer==4.0.0", "typer==0.20.0",
  "pyyaml==6.0.3", "httpx==0.28.1", "huggingface-hub==0.36.0",
  "psutil==7.1.3", "skops==0.13.0", "matplotlib==3.11.2"
]

[project.optional-dependencies]
train = ["torch==2.8.0", "transformers==4.57.1", "peft==0.17.1",
         "accelerate==1.11.0", "datasets==4.3.0", "librosa==0.11.0"]
diarization = ["pyannote.audio==4.0.1"]
gpu = ["nvidia-cublas-cu12==12.8.4.1", "nvidia-cudnn-cu12==9.10.2.21"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "ruff==0.14.4", "mypy==1.18.2",
       "types-PyYAML==6.0.12.20250915", "types-requests==2.32.4.20250913"]

[project.scripts]
north55 = "north55_speech.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/north55_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL and RabbitMQ", "real_asr: requires prefetched weights and lawful human audio", "gpu: requires GPU runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
